services:
  database:
    image: postgres:17
    container_name: authgate-database

    environment:
      POSTGRES_USER: authgate_user
      POSTGRES_PASSWORD: authgate_password
      POSTGRES_DB: authgate_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
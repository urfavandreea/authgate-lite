services:
  database:
    image: postgres:17
    container_name: authgate-database

    environment:
      POSTGRES_USER: authgate_user
      POSTGRES_PASSWORD: authgate_password
      POSTGRES_DB: authgate_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: authgate-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - database

volumes:
  postgres_data: